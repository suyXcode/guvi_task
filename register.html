<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="auth-card">
        <h3 class="brand-title text-center mb-1">Create an account</h3>
        <p class="text-muted text-center mb-4">Sign up to get started</p>

        <div id="alertBox" class="alert alert-box" role="alert"></div>

        <!-- Not a <form> tag on purpose: submission happens purely via jQuery AJAX -->
        <div id="registerForm">
            <div class="mb-3">
                <label for="username" class="form-label">Username</label>
                <input type="text" class="form-control" id="username" placeholder="janedoe" autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="email" class="form-label">Email</label>
                <input type="email" class="form-control" id="email" placeholder="jane@example.com" autocomplete="email">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="At least 6 characters" autocomplete="new-password">
            </div>
            <button id="registerBtn" class="btn btn-primary w-100">Register</button>
        </div>

        <p class="form-footer">Already have an account? <a href="login.html">Log in</a></p>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/register.js"></script>
</body>
</html>
