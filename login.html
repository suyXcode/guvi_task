<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="css/style.css" rel="stylesheet">
</head>
<body>
<div class="container">
    <div class="auth-card">
        <h3 class="brand-title text-center mb-1">Welcome back</h3>
        <p class="text-muted text-center mb-4">Log in to your account</p>

        <div id="alertBox" class="alert alert-box" role="alert"></div>

        <div id="loginForm">
            <div class="mb-3">
                <label for="identifier" class="form-label">Username or Email</label>
                <input type="text" class="form-control" id="identifier" placeholder="janedoe or jane@example.com" autocomplete="username">
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Password</label>
                <input type="password" class="form-control" id="password" placeholder="Password" autocomplete="current-password">
            </div>
            <button id="loginBtn" class="btn btn-primary w-100">Log in</button>
        </div>

        <p class="form-footer">Don't have an account? <a href="register.html">Register</a></p>
    </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/login.js"></script>
</body>
</html>
